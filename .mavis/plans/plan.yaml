        + apps\web\src\components\landing\bento-details.tsx
        + apps\web\src\components\landing\measure-guide.tsx
        + apps\web\src\landing.css (chỉ thêm block cho .bento-box:hover và .measure-content
          animation nếu cần)

      KHÔNG sửa: benefits.tsx, threat.tsx, use-theme-by-section.ts, custom-cursor-raw.tsx,
