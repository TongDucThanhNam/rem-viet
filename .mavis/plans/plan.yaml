tasks:
  - id: track-1-theme-benefits
    title: "Track 1 — Benefits section + theme engine theo viewport"
    assigned_to: coder
    timeout_ms: 1800000
    prompt: |
      Bạn là coder cho landing page LUXE MESH (workspace C:\Users\terasumi\Documents\source_code\rem-viet).
      App web: apps\web. Stack: React 19 + TanStack Start + framer-motion 12 + Tailwind v4 + Lenis smooth scroll.
      Đọc AGENTS.md ở root repo trước, đặc biệt mục "Landing page migration" — KHÔNG vi phạm các quy tắc ở đó.
      Đọc draft/style.css và draft/script.js để hiểu intent gốc.

      Mục tiêu track này — làm 2 việc ĐỘC LẬP, không đụng các file mà track khác sẽ sửa:

      (1) TẠO MỚI section <Benefits /> — section này THIẾU trong React version nhưng CÓ trong draft
          (id="benefits", class .benefits.dark-theme, 4-col grid với .benefit-card, border-top mỏng).
          Tạo file: apps\web\src\components\landing\benefits.tsx
          - Section id="benefits", className="benefits font-sans" (KHÔNG thêm "dark-theme" hard-coded
            nữa — để theme engine quản).
          - Tiêu đề lớn font-playfair (ví dụ: "Giá Trị Vượt Trội") + phụ đề font-vietnam.
          - 4 cards trong 1 grid responsive (4 cột desktop, 2 tablet, 1 mobile), mỗi card có
            icon SVG outline 32x32, h3 24px font-playfair, mô tả ngắn 14-16px opacity 0.7.
          - Nội dung 4 cards: (a) Sợi Thủy Tinh Cao Cấp — bền bỉ vượt trội; (b) May Đo Vừa Khít —
            đo chuẩn từng mm; (c) Bảo Vệ Vô Hình — chống muỗi UV; (d) Lắp Đặt Tận Nơi — dịch vụ
            chuyên nghiệp. Bạn có thể chỉnh wording cho sang, miễn đúng tinh thần.
          - Thêm framer-motion scroll-trigger: mỗi card fade-up + slight y stagger 0.1s khi vào viewport
            (dùng useInView + once: true, ease [0.19,1,0.22,1], duration 0.9).
          - Chèn <Benefits /> vào routes/index.tsx ngay SAU <Marquee /> và TRƯỚC <Craft />.
            Tìm đúng dòng chèn để không phá thứ tự các section khác.

      (2) TẠO MỚI theme engine theo viewport — hook apps\web\src\hooks\use-theme-by-section.ts
          - Cơ chế: dùng IntersectionObserver (rootMargin "-50% 0px -50% 0px" để section nào chiếm
            giữa viewport thì active) trên TẤT CẢ section có id (home, threat, benefits, craft, details,
            lifestyle, measure, faq, order).
          - Map mỗi id -> theme: dark cho "threat" + "lifestyle" (gallery), light cho còn lại.
            (Phù hợp draft: threat.dark-theme, gallery ngầm dark qua asset và layout).
          - Khi active section đổi, set <html data-theme="dark"|"light">. CustomCursorRaw và
            Navigation dùng CSS var (--text-color, --bg-color, --accent-color) — hook này sẽ làm
            giá trị var đổi theo data-theme, đảm bảo contrast đúng.
          - Mount hook 1 lần ở routes/index.tsx trong HomeComponent (gọi useThemeBySection()).
          - Tạo block CSS trong landing.css:
            :root[data-theme="dark"]  { --bg-color: #111; --text-color: #F8F5EF; }
            :root[data-theme="light"] { --bg-color: #F8F5EF; --text-color: #111; }
            đặt NGAY SAU block :root hiện tại (giữ nguyên --accent-color, --font-*).
          - XÓA class "dark-theme" hard-coded khỏi Threat, HorizontalGallery (không xóa CSS rule
            cũ .dark-theme ở landing.css, vẫn giữ để tránh regression). KHÔNG thêm class dark-theme
            vào <Benefits /> vừa tạo.
          - KHÔNG sửa custom-cursor-raw.tsx, navigation.tsx, bento-details.tsx, measure-guide.tsx,
            craft.tsx, marquee.tsx, curtain-footer.tsx, faq.tsx — đó là slot của track khác.

      File bạn sẽ sửa / tạo (liệt kê rõ để tránh đụng track khác):
        + apps\web\src\components\landing\benefits.tsx (MỚI)
        + apps\web\src\hooks\use-theme-by-section.ts (MỚI)
        + apps\web\src\landing.css (chỉ thêm block :root[data-theme] + .benefits theo draft)
        + apps\web\src\routes\index.tsx (import Benefits + useThemeBySection, chèn <Benefits />,
          gọi hook trong HomeComponent)
        + apps\web\src\components\landing\threat.tsx (XÓA " dark-theme" khỏi className)
        + apps\web\src\components\landing\horizontal-gallery.tsx (XÓA " dark-theme" nếu có)

      Sau khi code xong, CHẠY và PASS:
        cd apps\web
        bun run check-types
        bun run build
      Cả 2 phải xanh. Nếu fail, tự sửa trước khi exit.

      Kết thúc, viết deliverable.md ngắn gồm: (a) danh sách file đã sửa/tạo, (b) kết quả
      check-types + build, (c) mô tả 1 dòng cho mỗi thay đổi.
    verified_by: verifier
    verify_prompt: |
      Verify track 1 độc lập — KHÔNG re-read deliverable.md để chấm.
      Chạy lại 2 lệnh:
        cd apps\web && bun run check-types
        cd apps\web && bun run build
      Cả 2 phải pass với exit code 0. Nếu fail, FAIL với lý do cụ thể (file nào, lỗi gì).

      Sau đó mở file và kiểm chứng:
      1) apps\web\src\components\landing\benefits.tsx tồn tại, export Benefits, có section id="benefits",
         KHÔNG có "dark-theme" trong className, có 4 .benefit-card (hoặc tương đương), dùng
         framer-motion để scroll-trigger fade-up.
      2) apps\web\src\hooks\use-theme-by-section.ts tồn tại, export useThemeBySection, dùng
         IntersectionObserver, set <html data-theme="...">. KHÔNG gọi DOM thô ngoài hook.
      3) apps\web\src\routes\index.tsx đã import cả 2 trên và gọi useThemeBySection() trong
         HomeComponent. <Benefits /> nằm giữa <Marquee /> và <Craft /> (đúng thứ tự).
      4) threat.tsx và horizontal-gallery.tsx KHÔNG còn "dark-theme" trong className.
      5) landing.css có block :root[data-theme="dark"] và :root[data-theme="light"] đặt đúng chỗ
         (sau :root, trước các rule khác).
      6) File track khác KHÔNG bị đụng: dùng git diff --name-only HEAD để xác nhận
         custom-cursor-raw.tsx, navigation.tsx, bento-details.tsx, measure-guide.tsx, craft.tsx,
         marquee.tsx, curtain-footer.tsx, faq.tsx, scroll-progress.tsx (nếu tồn tại) KHÔNG
         nằm trong diff.

      Báo cáo PASS/FAIL với evidence (paste 5-10 dòng output của `bun run check-types` + build).

  - id: track-2-cursor-progress-anchors
    title: "Track 2 — Cursor label + Scroll progress bar + Smooth anchor nav"
    assigned_to: coder
    timeout_ms: 1800000
    prompt: |
      Bạn là coder cho landing LUXE MESH. Stack như track 1.
      Slot CỦA BẠN (không đụng track khác):
        + apps\web\src\components\custom-cursor-raw.tsx (sửa — thêm label theo data-cursor)
        + apps\web\src\components\scroll-progress.tsx (MỚI — thanh progress ở top viewport)
        + apps\web\src\components\landing\navigation.tsx (sửa anchor link + thêm data-cursor)
        + apps\web\src\routes\index.tsx (CHỈ chèn <ScrollProgress /> ngay sau <LoadingScreenRaw />,
          KHÔNG sửa phần còn lại)
        + apps\web\src\landing.css (chỉ thêm block .scroll-progress)

      KHÔNG sửa: benefits.tsx, threat.tsx, use-theme-by-section.ts, bento-details.tsx,
      measure-guide.tsx, craft.tsx, marquee.tsx, curtain-footer.tsx, faq.tsx, hero.tsx,
      use-magnetic*.ts.

      (1) Cursor label — apps\web\src\components\custom-cursor-raw.tsx
          Hiện đã có dot với mix-blend-difference. Thêm cơ chế "label":
          - Khi rê chuột vào element có attribute `data-cursor="..."`, dot phóng to 60-80px và
            hiển thị text label ở giữa (font-vietnam, uppercase, tracking-widest, 10-11px, color
            tương phản với dot).
          - Dùng data-cursor hiện có ở curtain-footer ("Đặt may") và tự thêm ở navigation CTA
            "Tư Vấn" -> data-cursor="Liên hệ" và bất kỳ nơi nào có .hover-target quan trọng
            (các nav link, btn-primary). KHÔNG thêm vào từng thẻ — chỉ 4-6 chỗ chủ chốt.
          - Class đã có .cursor.hovering / .cursor.has-text trong landing.css — dùng lại, không
            trùng class.
          - Giữ nguyên cấu trúc file, chỉ thêm logic querySelectorAll('[data-cursor]') trong
            useEffect, attach mousemove/mouseleave.

      (2) Scroll progress bar — apps\web\src\components\scroll-progress.tsx (MỚI)
          - Thanh ngang fixed top:0, left:0, height 2-3px, width = scrollYProgress * 100vw.
          - Dùng framer-motion useScroll + useSpring (stiffness 120, damping 20) để mượt.
          - Màu accent: var(--accent-color) — tự đổi khi theme đổi (do track 1 set data-theme).
          - Z-index cao (z-[9999]) để nằm trên cùng.
          - Mount trong routes/index.tsx, đặt ngay sau <LoadingScreenRaw /> (trước <CustomCursorRaw />).

      (3) Smooth anchor nav — apps\web\src\components\landing\navigation.tsx
          - Hiện các MagneticLink dùng href="#vision" (KHÔNG tồn tại), "#details", "#measure".
            Cập nhật lại:
              "Tầm Nhìn"    -> href="#threat"  (anchor đến section threat — đổi label thành "Câu Chuyện"
                                            cho hợp, hoặc giữ "Tầm Nhìn" cũng được, miễn map đúng id)
              "Chi Tiết"    -> href="#details"
              "Cách Đo"     -> href="#measure"
              Nav CTA "Tư Vấn" -> href="#order", thêm data-cursor="Liên hệ"
          - Thêm data-cursor="Xem" cho 3 nav link chính (Tầm Nhìn / Chi Tiết / Cách Đo).
          - Thêm onClick handler: e.preventDefault() + window.scrollTo với behavior:'smooth' (vì
            Lenis đã smooth-scroll, cách đơn giản nhất là dùng Lenis instance qua useEffect nếu
            đã mount global; nếu không, dùng document.getElementById(href.slice(1))?.scrollIntoView
            với behavior:'smooth' — Lenis sẽ tự override).
          - KHÔNG thay đổi kiểu dáng nav. Chỉ sửa href, label (nếu cần), data-cursor, onClick.

      Sau khi code xong CHẠY:
        cd apps\web
        bun run check-types
        bun run build
      Cả 2 phải pass. Tự sửa nếu fail.

      Kết thúc, viết deliverable.md.
    verified_by: verifier
    verify_prompt: |
      Verify track 2 độc lập. Chạy:
