      curtain-footer.tsx, faq.tsx, horizontal-gallery.tsx, use-magnetic*.ts, use-scroll-animation.ts.

      (1) Bento polish — apps\web\src\components\landing\bento-details.tsx
          - Bento box (.bento-box) HIỆN tĩnh. Thêm:
            (a) Hover tilt nhẹ: dùng framer-motion useMotionValue + useTransform cho rotateX/rotateY
                theo vị trí chuột (max ±4deg). Wrap bento-box trong motion.div, perspective 1000px
                ở parent. Hiệu ứng: Ảnh .bento-bg img scale 1.05 + content fade-up 4px.
            (b) Stat count-up: 2 .stat-num hiện là text tĩnh ("0%", "∞"). Làm count-up cho
                "0%" -> "0%" (giữ nguyên nếu khó), thêm 2 stat mới với số liệu thật:
                - "10" năm với label "Độ bền" — count 0->10 trong 1.5s khi vào viewport.
                - "99.9" % với label "Chống muỗi" — count 0->99.9 với 1 decimal, 1.5s.
                Dùng useInView + useMotionValue + animate (của framer-motion) hoặc một helper nhỏ
                useCountUp(value, duration).
            (c) Image parallax nhẹ trong .bento-bg: scrollYProgress của từng card -> translateY
                ±15px tùy chiều scroll. Dùng useScroll + useTransform.
          - Đảm bảo mobile (≤768px) KHÔNG có hover tilt (pointer: coarse) — chỉ giữ count-up
