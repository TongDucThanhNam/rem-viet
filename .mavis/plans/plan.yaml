      3) navigation.tsx: 3 nav link href map đúng id tồn tại trong DOM
         ("#threat"/"#home"/"#details"/"#measure"). Có data-cursor. KHÔNG còn href="#vision"
         (trừ khi đã thêm id="vision" ở đâu đó).
      4) custom-cursor-raw.tsx: có logic querySelectorAll('[data-cursor]'), toggling class
         .has-text và set label text. Không hardcode danh sách selector cụ thể cho từng element.
      5) git diff --name-only HEAD: các file ngoài slot của track 2 KHÔNG bị đụng.
         Slot hợp lệ: custom-cursor-raw.tsx, scroll-progress.tsx, navigation.tsx,
         routes/index.tsx, landing.css.

      Báo cáo PASS/FAIL với evidence.

  - id: track-3-bento-measure-polish
    title: "Track 3 — Bento + Measure-Guide polish (hover tilt, stat count-up, mask reveal mạnh hơn)"
