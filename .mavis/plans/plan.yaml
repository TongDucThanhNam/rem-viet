            useTransform cho y từ -50 đến +50px theo scrollYProgress.
          - Thêm scroll-trigger reveal cho .measure-content: fade-up + slight x slide khi vào
            viewport (inView, once:true, stagger 0.1s giữa tiêu đề/desc).
          - Nếu file chưa dùng framer-motion, thêm import. Nếu đã có hook useScrollAnimation.ts
